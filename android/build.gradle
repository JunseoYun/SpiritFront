buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24" //2025.05.15 2.1.0 버전 업그레이드
        // kotlinVersion = "2.1.0"
        googleMobileAds = [
            adManager: false // ← 이것이 핵심
        ]
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0") // ✅ 버전 명시
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24") //2025.05.15 2.1.0 버전 업그레이드
        // classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0") // ✅ 버전 명시
        classpath("com.google.gms:google-services:4.4.2")
    }
}


apply plugin: "com.facebook.react.rootproject"
